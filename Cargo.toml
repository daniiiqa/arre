[package]
name = "arre"
version = "0.1.0"
edition = "2024"
description = "arre, enterado: las notificaciones de discada con el look de vato y rola"
license = "MIT"

[dependencies]
disco = { git = "https://github.com/daniiiqa/disco", features = ["paint"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
tiny-skia = "0.12.0"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
